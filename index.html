<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>聊天室</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <div class="header">
      <span class="header-title">💬 聊天室</span>
      <div class="name-area">
        <input id="nameInput" placeholder="你的昵称" maxlength="10"/>
        <button id="nameBtn">确认</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input id="msgInput" placeholder="输入消息..." autocomplete="off"/>
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAx0IGF5q0DAZLYY2QTt5gdviqp-VSqxQU",
      authDomain: "chat-0611.firebaseapp.com",
      databaseURL: "https://chat-0611-default-rtdb.firebaseio.com",
      projectId: "chat-0611",
      storageBucket: "chat-0611.firebasestorage.app",
      messagingSenderId: "398077653757",
      appId: "1:398077653757:web:c49dd5ced0d94ccb8e0494"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const msgsRef = ref(db, 'messages');

    let myName = localStorage.getItem('chatName') || '';
    const nameInput = document.getElementById('nameInput');
    const nameBtn = document.getElementById('nameBtn');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesEl = document.getElementById('messages');

    if (myName) nameInput.value = myName;

    nameBtn.addEventListener('click', () => {
      const n = nameInput.value.trim();
      if (!n) return;
      myName = n;
      localStorage.setItem('chatName', n);
      nameInput.value = n;
    });

    function sendMsg() {
      const text = msgInput.value.trim();
      if (!text) return;
      if (!myName) { alert('请先输入昵称！'); return; }
      push(msgsRef, { name: myName, text, time: Date.now() });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMsg);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

    onValue(msgsRef, snapshot => {
      messagesEl.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;
      Object.values(data).forEach(msg => {
        const isMine = msg.name === myName;
        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const t = new Date(msg.time);
        meta.textContent = `${msg.name} · ${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.text;

        div.append(meta, bubble);
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  </script>
</body>
</html>
