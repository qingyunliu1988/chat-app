<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>秘密基地</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header"><div class="sidebar-title">消息</div></div>
    <div class="room-list">
      <div class="room-item active">
        <div class="room-icon ri-1">🔐</div>
        <div class="room-info">
          <div class="room-name">秘密基地</div>
          <div class="room-last" id="sidebarLast">暂无消息</div>
        </div>
        <div class="badge" id="badge" style="display:none">新</div>
      </div>
    </div>
    <div class="sidebar-section">在线成员</div>
    <div class="online-members" id="onlineMembers"></div>
    <div class="sidebar-bottom">
      <div class="my-av" id="myAv">?</div>
      <div>
        <div class="my-name" id="myNameLabel">未登录</div>
        <div class="my-status" id="myStatus" style="color:rgba(255,255,255,0.3)">● 离线</div>
      </div>
      <div class="settings-icon">⚙</div>
    </div>
  </div>

  <div class="chat">
    <div class="chat-header">
      <div class="chat-av">🔐</div>
      <div class="chat-info">
        <div class="chat-name">秘密基地</div>
        <div class="chat-sub" id="chatSub">请先登录</div>
      </div>
      <div class="header-inputs">
        <input id="nameInput" placeholder="昵称" maxlength="10"/>
        <input id="keyInput" placeholder="房间密码" type="password" maxlength="32"/>
        <button id="joinBtn">进入</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="hint" id="hint">输入昵称和房间密码，进入秘密基地 🔐</div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input id="msgInput" placeholder="输入消息..." autocomplete="off" disabled/>
        <span class="icon-btn">😊</span>
        <button class="send-btn" id="sendBtn" disabled>➤</button>
      </div>
    </div>
  </div>
</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAx0IGF5q0DAZLYY2QTt5gdviqp-VSqxQU",
      authDomain: "chat-0611.firebaseapp.com",
      databaseURL: "https://chat-0611-default-rtdb.firebaseio.com",
      projectId: "chat-0611",
      storageBucket: "chat-0611.firebasestorage.app",
      messagingSenderId: "398077653757",
      appId: "1:398077653757:web:c49dd5ced0d94ccb8e0494"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const msgsRef = ref(db, 'messages');
    const presenceRef = ref(db, 'presence');

    let myName = '', cryptoKey = null;
    const colors = ['#7c3aed','#ec4899','#0ea5e9','#f59e0b','#10b981','#ef4444'];

    function getColor(name) {
      let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) % colors.length;
      return colors[h];
    }

    const nameInput   = document.getElementById('nameInput');
    const keyInput    = document.getElementById('keyInput');
    const joinBtn     = document.getElementById('joinBtn');
    const msgInput    = document.getElementById('msgInput');
    const sendBtn     = document.getElementById('sendBtn');
    const messagesEl  = document.getElementById('messages');
    const hint        = document.getElementById('hint');
    const myAvEl      = document.getElementById('myAv');
    const myNameLabel = document.getElementById('myNameLabel');
    const myStatusEl  = document.getElementById('myStatus');
    const chatSubEl   = document.getElementById('chatSub');
    const onlineMembersEl = document.getElementById('onlineMembers');
    const sidebarLast = document.getElementById('sidebarLast');

    const saved = localStorage.getItem('chatName');
    if (saved) nameInput.value = saved;

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: enc.encode('secret-base-2024'), iterations:100000, hash:'SHA-256' },
        km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
      );
    }

    async function encrypt(text) {
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, enc.encode(text));
      const combined = new Uint8Array(iv.length + ct.byteLength);
      combined.set(iv); combined.set(new Uint8Array(ct), iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    async function decrypt(b64) {
      try {
        const combined = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const iv = combined.slice(0,12), ct = combined.slice(12);
        const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, cryptoKey, ct);
        return new TextDecoder().decode(plain);
      } catch { return '🔒 无法解密'; }
    }

    joinBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim(), pwd = keyInput.value.trim();
      if (!name || !pwd) { alert('请填写昵称和密码！'); return; }
      myName = name;
      cryptoKey = await deriveKey(pwd);
      localStorage.setItem('chatName', name);

      const color = getColor(name);
      myAvEl.textContent = name[0].toUpperCase();
      myAvEl.style.background = color;
      myNameLabel.textContent = name;
      myStatusEl.textContent = '● 在线';
      myStatusEl.style.color = '#34d399';
      chatSubEl.textContent = '已加密连接 🔒';
      chatSubEl.style.color = '#34d399';

      hint.style.display = 'none';
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
      joinBtn.textContent = '✔ 已进入';
      joinBtn.disabled = true;
      joinBtn.style.opacity = '0.5';

      const myPresenceRef = ref(db, 'presence/' + name);
      set(myPresenceRef, { name, color, online: true, ts: serverTimestamp() });
      onDisconnect(myPresenceRef).remove();
    });

    onValue(presenceRef, snapshot => {
      onlineMembersEl.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;
      Object.values(data).forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <div class="user-av" style="background:${u.color}">${u.name[0].toUpperCase()}<div class="status-dot online"></div></div>
          <div class="user-name${u.name===myName?' me':''}">${u.name}</div>
        `;
        onlineMembersEl.appendChild(div);
      });
      const count = Object.keys(data).length;
      if (myName) chatSubEl.textContent = `${count} 人在线 · 已加密 🔒`;
    });

    function formatDate(ts) {
      const d = new Date(ts), now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const y = new Date(now - 86400000);
      const isYesterday = d.toDateString() === y.toDateString();
      if (isToday) return '今天';
      if (isYesterday) return '昨天';
      return d.toLocaleDateString('zh-CN', { month:'long', day:'numeric' });
    }

    let typingTimer;
    const typingRef = ref(db, 'typing');

    msgInput.addEventListener('input', () => {
      if (!myName) return;
      set(ref(db, 'typing/' + myName), { name: myName, ts: Date.now() });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => set(ref(db, 'typing/' + myName), null), 2000);
    });

    onValue(typingRef, snapshot => {
      const data = snapshot.val();
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
      if (!data) return;
      const others = Object.values(data).filter(t => t.name !== myName && Date.now() - t.ts < 3000);
      if (others.length === 0) return;
      const div = document.createElement('div');
      div.id = 'typing-indicator';
      div.className = 'typing';
      div.innerHTML = `
        <div class="typing-av" style="background:${getColor(others[0].name)}">${others[0].name[0].toUpperCase()}</div>
        <div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    async function sendMsg() {
      const text = msgInput.value.trim();
      if (!text || !cryptoKey) return;
      const encrypted = await encrypt(text);
      push(msgsRef, { name: myName, text: encrypted, time: Date.now(), color: getColor(myName) });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMsg);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

    onValue(msgsRef, async snapshot => {
      if (!cryptoKey) return;
      messagesEl.innerHTML = '';
      const data = snapshot.val();
      if (!data) { messagesEl.innerHTML = '<div class="hint">还没有消息，说点什么吧 😊</div>'; return; }

      let lastDate = '';
      for (const msg of Object.values(data)) {
        const dateLabel = formatDate(msg.time);
        if (dateLabel !== lastDate) {
          lastDate = dateLabel;
          const chip = document.createElement('div');
          chip.className = 'date-chip';
          chip.textContent = dateLabel;
          messagesEl.appendChild(chip);
        }

        const isMine = msg.name === myName;
        const text = await decrypt(msg.text);
        const t = new Date(msg.time);
        const timeStr = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;

        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
        div.innerHTML = `
          <div class="msg-row">
            <div class="av-xs" style="background:${msg.color||getColor(msg.name)}">${msg.name[0].toUpperCase()}</div>
            <div class="bubble">${text}</div>
          </div>
          <div class="msg-footer">
            ${!isMine ? `<span class="msg-sender">${msg.name}</span>` : ''}
            <span class="msg-time">${timeStr}</span>
            ${isMine ? '<span class="read-tick">✔✔</span>' : ''}
          </div>
        `;
        messagesEl.appendChild(div);
        sidebarLast.textContent = (isMine ? '你: ' : msg.name + ': ') + text.slice(0,15) + (text.length > 15 ? '…' : '');
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  </script>
</body>
</html>
