<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>加密聊天室</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <div class="header">
      <span class="header-title">🔐 加密聊天室</span>
      <div class="header-inputs">
        <input id="nameInput" placeholder="昵称" maxlength="10"/>
        <input id="keyInput" placeholder="房间密码" type="password" maxlength="32"/>
        <button id="joinBtn">进入</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="hint" id="hint">请输入昵称和房间密码后进入聊天</div>
    </div>
    <div class="input-bar">
      <input id="msgInput" placeholder="输入消息..." autocomplete="off" disabled/>
      <button id="sendBtn" disabled>发送</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAx0IGF5q0DAZLYY2QTt5gdviqp-VSqxQU",
      authDomain: "chat-0611.firebaseapp.com",
      databaseURL: "https://chat-0611-default-rtdb.firebaseio.com",
      projectId: "chat-0611",
      storageBucket: "chat-0611.firebasestorage.app",
      messagingSenderId: "398077653757",
      appId: "1:398077653757:web:c49dd5ced0d94ccb8e0494"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const msgsRef = ref(db, 'messages');

    let myName = '';
    let cryptoKey = null;

    const nameInput = document.getElementById('nameInput');
    const keyInput  = document.getElementById('keyInput');
    const joinBtn   = document.getElementById('joinBtn');
    const msgInput  = document.getElementById('msgInput');
    const sendBtn   = document.getElementById('sendBtn');
    const messagesEl= document.getElementById('messages');
    const hint      = document.getElementById('hint');

    // 从密码生成加密密钥
    async function deriveKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode('chat-salt-2024'), iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    // 加密
    async function encrypt(text) {
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        cryptoKey,
        enc.encode(text)
      );
      const combined = new Uint8Array(iv.length + ciphertext.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(ciphertext), iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    // 解密
    async function decrypt(b64) {
      try {
        const combined = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const iv = combined.slice(0, 12);
        const ciphertext = combined.slice(12);
        const plain = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          cryptoKey,
          ciphertext
        );
        return new TextDecoder().decode(plain);
      } catch {
        return '🔒 无法解密（密码不匹配）';
      }
    }

    // 进入聊天
    joinBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const pwd  = keyInput.value.trim();
      if (!name || !pwd) { alert('请填写昵称和房间密码！'); return; }
      myName = name;
      cryptoKey = await deriveKey(pwd);
      localStorage.setItem('chatName', name);
      hint.style.display = 'none';
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
      joinBtn.textContent = '✔ 已进入';
      joinBtn.style.opacity = '0.6';
      joinBtn.disabled = true;
    });

    // 发送
    async function sendMsg() {
      const text = msgInput.value.trim();
      if (!text || !cryptoKey) return;
      const encrypted = await encrypt(text);
      push(msgsRef, { name: myName, text: encrypted, time: Date.now() });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMsg);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

    // 接收消息
    onValue(msgsRef, async snapshot => {
      if (!cryptoKey) return;
      messagesEl.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;
      for (const msg of Object.values(data)) {
        const isMine = msg.name === myName;
        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const t = new Date(msg.time);
        meta.textContent = `${msg.name} · ${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = await decrypt(msg.text);

        div.append(meta, bubble);
        messagesEl.appendChild(div);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    // 恢复昵称
    const saved = localStorage.getItem('chatName');
    if (saved) nameInput.value = saved;
  </script>
</body>
</html>
